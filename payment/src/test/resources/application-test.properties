# Test profile: datasource is supplied by the Testcontainers @ServiceConnection.
stripe.secret.key=sk_test_dummy
eureka.client.enabled=false
spring.cloud.discovery.enabled=false
spring.cloud.service-registry.auto-registration.enabled=false
# Spring Cloud 2025.1.1 only certifies Boot 4.0.x — skip the abort-on-startup check.
spring.cloud.compatibility-verifier.enabled=false
# No Vault in tests.
spring.cloud.vault.enabled=false
# Stub the client secrets whose fallbacks were purged from application.yml; tests never contact a real IdP.
OAUTH2_INTROSPECTION_CLIENT_SECRET=test-introspection-secret
GATEWAY_CLIENT_SECRET=test-gateway-secret
gateway.trust.secret=test-shared-secret
