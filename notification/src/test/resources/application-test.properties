# Test profile — infrastructure supplied by Testcontainers (see AbstractIntegrationTest).
# Never H2 (real Postgres); never disable Flyway; ddl-auto stays validate.

#JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=FALSE
spring.jpa.properties.hibernate.show_sql=FALSE

#Flyway owns the schema
spring.flyway.enabled=true

#Resource server — lazy jwk-set-uri so the JwtDecoder bean exists for the filter chain;
#tests authenticate via spring-security-test (jwt()/@WithMockUser), so the endpoint is never contacted.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8082/oauth2/jwks

#Gateway trust filter — signing secret for X-User-Id/X-User-Roles verification (test-only value)
gateway.trust.secret=test-shared-secret

#Disable cloud/infra integrations during tests (Vault import lives in application-dev.yml, inactive here)
spring.cloud.vault.enabled=false
spring.cloud.compatibility-verifier.enabled=false
spring.docker.compose.enabled=false
eureka.client.enabled=false
eureka.client.fetch-registry=false
eureka.client.register-with-eureka=false

#Mail -> GreenMail (fixed ServerSetupTest.SMTP port 3025)
spring.mail.host=localhost
spring.mail.port=3025

#Logging
logging.level.org=WARN
logging.level.com.ganchevdimitarg=INFO
