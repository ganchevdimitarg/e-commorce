# Test bootstrap — overrides the main bootstrap.yml on the test classpath.
# No Vault / config import in tests: avoids connection attempts to a non-running Vault.
server:
  port: 8082

spring:
  application:
    name: auth-service
  profiles:
    active: test
  cloud:
    compatibility-verifier:
      enabled: false
    vault:
      enabled: false
  config:
    import: []
