server:
  port: 8082
spring:
  application:
    name: auth-service
  devtools:
    livereload:
      port: 35730
  profiles:
    include: dev
  cloud:
    vault:
      uri: http://localhost:8200
      authentication: TOKEN
      token: ${VAULT_DEV_ROOT_TOKEN_ID}
      kv:
        enabled: true
        backend: secret
    config:
      import: "optional:vault://"
  config:
    import: "optional:file:.env[.properties]"