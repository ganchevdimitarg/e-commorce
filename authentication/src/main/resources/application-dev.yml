spring:
  threads:
    virtual:
      enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  #Data Source Properties
  data:
    mongodb:
      username: ${MONGO_DB_USERNAME}
      password: ${MONGO_DB_PASSWORD}
      database: ${MONGO_DB_DATABASE}
      authentication-database: admin
      port: 27017
      host: localhost
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  datasource:
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    url: jdbc:postgresql://localhost:5432/registered_client

  # Flyway placeholders — V8 rotates the gateway client secret without committing the
  # hash. GATEWAY_CLIENT_SECRET_HASH is required at startup (like POSTGRES_USER above):
  # a bare BCrypt(12) hash whose plaintext is served as GATEWAY_CLIENT_SECRET.
  flyway:
    placeholders:
      gateway_client_secret_hash: ${GATEWAY_CLIENT_SECRET_HASH}

  #JPA Properties
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true

#Logging Levels
#Disable the default loggers
logging:
  level:
    blog: WARN
    root: INFO
    org:
      springframework:
        web: INFO
        security: TRACE
        oauth2: INFO
        vault: DEBUG
        cloud.vault: DEBUG
    io:
      github:
        resilience4j: ERROR
  pattern:
    level: "%5p [${spring.application.name},%X{traceId},%X{spanId}]"

auth:
  issuer-uri: ${AUTH_ISSUER_URI:http://localhost:8082}
  jwk:
    location: ${AUTH_JWK_DIR:./.localkeys}

#Eureka
eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USERNAME:eureka}:${EUREKA_PASSWORD}@localhost:8761/eureka,http://${EUREKA_USERNAME:eureka}:${EUREKA_PASSWORD}@localhost:8762/eureka


management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
  tracing:
    sampling:
      probability: 1.0  # 100% for development
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs