spring.cloud.compatibility-verifier.enabled=false
spring.cloud.vault.enabled=false
spring.cloud.config.import=
spring.security.oauth2.client.registration.gateway-client-oidc.provider=spring
spring.security.oauth2.client.registration.gateway-client-oidc.client-id=test-client
spring.security.oauth2.client.registration.gateway-client-oidc.client-secret=test-secret
spring.security.oauth2.client.registration.gateway-client-oidc.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.gateway-client-oidc.redirect-uri=http://127.0.0.1:8081/login/oauth2/code/gateway-client-oidc
spring.security.oauth2.client.provider.spring.issuer-uri=http://localhost:8082
spring.security.oauth2.client.provider.spring.authorization-uri=http://localhost:8082/oauth2/authorize
spring.security.oauth2.client.provider.spring.token-uri=http://localhost:8082/oauth2/token
spring.data.redis.host=localhost
spring.data.redis.port=6379
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
management.endpoints.web.exposure.include=health,info,metrics,prometheus,circuitbreakers
gateway.trust.secret=test-shared-secret
