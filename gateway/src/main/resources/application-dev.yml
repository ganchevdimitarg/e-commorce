spring:
  application:
    name: gateway

  # OAuth2 Security Configuration
  security:
    oauth2:
      client:
        registration:
          gateway-client-oidc:
            provider: spring
            client-id: ${GATEWAY_CLIENT_ID}
            client-secret: ${GATEWAY_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "http://127.0.0.1:${server.port}/login/oauth2/code/{registrationId}"
            scope: openid, catalog.read, catalog.write, profile.read, profile.write,
              order.read, order.write, notification.read, notification.write
            client-name: gateway-client-oidc
        
        provider:
          spring:
            issuer-uri: http://localhost:8082
            authorization-uri: http://localhost:8082/oauth2/authorize
            token-uri: http://localhost:8082/oauth2/token

  # Spring Cloud Gateway MVC Configuration
  cloud:
    gateway:
      mvc:
        default-filters:
          - TokenRelay
          - name: Retry
            args:
              retries: 3
              methods: GET
              backoff:
                firstBackoff: 50ms
                maxBackoff: 500ms
        
        routes:
          - id: catalog-service
            uri: lb://catalog-service
            predicates:
              - Path=/api/v1/catalog/**
            filters:
              - name: CircuitBreaker
                args:
                  name: catalogService
                  fallbackUri: forward:/fallback/catalog

          - id: profile-service
            uri: lb://profile-service
            predicates:
              - Path=/api/v1/profile/**
            filters:
              - name: CircuitBreaker
                args:
                  name: profileService
                  fallbackUri: forward:/fallback/profile

          - id: notification-service
            uri: lb://notification-service
            predicates:
              - Path=/api/v1/notification/**
            filters:
              - name: CircuitBreaker
                args:
                  name: notificationService
                  fallbackUri: forward:/fallback/notification

          - id: order-service
            uri: lb://order-service
            predicates:
              - Path=/api/v1/order/**
            filters:
              - name: CircuitBreaker
                args:
                  name: orderService
                  fallbackUri: forward:/fallback/order

          - id: payment-service
            uri: lb://payment-service
            predicates:
              - Path=/api/v1/payment/**
            filters:
              - name: CircuitBreaker
                args:
                  name: paymentService
                  fallbackUri: forward:/fallback/payment

# Eureka Client Configuration
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    fetch-registry: true
    register-with-eureka: true

# Logging Configuration
logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.springframework.security.oauth2: INFO
    io.github.resilience4j: DEBUG

# Actuator & Metrics Configuration
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus, circuitbreakers
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0  # 100% for development
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs
  health:
    circuitbreakers:
      enabled: true
    ratelimiters:
      enabled: true

# SpringDoc OpenAPI Configuration
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    oauth:
      client-id: ${GATEWAY_CLIENT_ID}
      use-pkce-with-authorization-code-grant: true
  api-docs:
    enabled: true
    path: /v3/api-docs