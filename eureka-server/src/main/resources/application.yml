server:
  port: 8761

spring:
  application:
    name: eureka-server
  zipkin:
    enabled: false

eureka:
  client:
    fetch-registry: false
    register-with-eureka: false

management:
  otlp:
    metrics:
      export:
        enabled: false
  opentelemetry:
    tracing:
      export:
        otlp:
          enabled: false
  tracing:
    sampling:
      probability: 0.0

