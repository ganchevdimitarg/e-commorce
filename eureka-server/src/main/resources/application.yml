server:
  port: 8761

spring:
  application:
    name: eureka-server
  zipkin:
    enabled: false
  #Spring Cloud — Spring Cloud 2025.1 only certifies Boot 4.0.x; suppress the verifier on Boot 4.1.x
  cloud:
    compatibility-verifier:
      enabled: false
  security:
    user:
      name: ${EUREKA_USERNAME:eureka}
      password: ${EUREKA_PASSWORD}

eureka:
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: ${EUREKA_PEER_ZONES:http://${EUREKA_USERNAME:eureka}:${EUREKA_PASSWORD}@eureka-server-1:8761/eureka/,http://${EUREKA_USERNAME:eureka}:${EUREKA_PASSWORD}@eureka-server-2:8761/eureka/}

management:
  otlp:
    metrics:
      export:
        enabled: false
  opentelemetry:
    tracing:
      export:
        otlp:
          enabled: false
  tracing:
    sampling:
      probability: 0.0

