spring:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
  cloud:
    vault:
      enabled: false
  config:
    import: "optional:configserver:"

kafka:
  bootstrapAddress: localhost:9092

eureka:
  client:
    enabled: false
    fetch-registry: false
    register-with-eureka: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
