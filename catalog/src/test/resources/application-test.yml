spring:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
  cloud:
    vault:
      enabled: false
    compatibility-verifier:
      enabled: false
  # JWT resource-server config — tests use @WithMockUser so the JWK endpoint is never contacted,
  # but the JwtDecoder bean must exist for the security filter chain to initialise.
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8082/oauth2/jwks
  # Ensure Docker Compose support is off in tests (Testcontainers provides infrastructure)
  docker:
    compose:
      enabled: false

kafka:
  bootstrapAddress: localhost:9092

eureka:
  client:
    enabled: false
    fetch-registry: false
    register-with-eureka: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
