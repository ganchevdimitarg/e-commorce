# Testcontainers classpath settings. The reuse key below is inert on Testcontainers
# 2.0.5, which reads it only from ~/.testcontainers.properties or the environment;
# catalog/pom.xml exports TESTCONTAINERS_REUSE_ENABLE to the Surefire fork instead, and
# only -Dtestcontainers.reuse.enable=false disables it. Reuse covers Redis and Kafka
# only: Postgres is a deliberately non-reusable singleton with a fresh container per run.
testcontainers.reuse.enable=true
