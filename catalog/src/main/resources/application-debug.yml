# Opt-in SQL diagnostics. Activate with SPRING_PROFILES_ACTIVE=dev,debug.
# The default dev profile stays quiet; Micrometer records HTTP timings independently.
spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org:
      hibernate:
        SQL: DEBUG
        type:
          descriptor: TRACE
