# Local-development overlay. Every value is environment-overridable and defaults to the
# catalog/compose.yaml data plane or to the monorepo services (Vault, Eureka, auth).
spring:
  # Optional: the app runs without Vault (fail-fast is off, import is optional).
  config:
    import: "optional:vault://"

  cloud:
    vault:
      uri: ${VAULT_URI:http://localhost:8200}
      authentication: TOKEN
      token: ${VAULT_DEV_ROOT_TOKEN_ID}
      enabled: ${SPRING_CLOUD_VAULT_ENABLED:true}
      kv:
        enabled: true
        backend: ${VAULT_BACKEND:secret}
        default-context: ${VAULT_DEFAULT_CONTEXT:catalog/credentials}
      fail-fast: false

  # Data source properties — credentials shared by the routed writer/reader pools
  datasource:
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  # Security
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER_URI:http://localhost:8082}
          jwk-set-uri: ${AUTH_JWK_SET_URI:http://localhost:8082/oauth2/jwks}

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # Kafka
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  # Docker Compose Support — catalog manages its own data plane in local development
  docker:
    compose:
      enabled: ${SPRING_DOCKER_COMPOSE_ENABLED:true}
      file: compose.yaml
      lifecycle-management: start_and_stop
      skip:
        in-tests: true

  # Devtools live reload
  devtools:
    livereload:
      port: 35730

# Logging levels — disable the default loggers
logging:
  level:
    blog: WARN
    root: INFO
    org:
      springframework:
        web: INFO
        security: INFO
        oauth2: INFO

# Eureka
eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}

management:
  tracing:
    sampling:
      probability: 0.1
    export:
      enabled: ${TRACING_EXPORT_ENABLED:true}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  # Log export stays off without a collector; enable it together with an endpoint.
  logging:
    export:
      otlp:
        enabled: ${OTLP_LOGGING_EXPORT_ENABLED:false}

# Spring Doc
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
    oauth2RedirectUrl: ${GATEWAY_OAUTH2_REDIRECT_URL:http://127.0.0.1:8081/login/oauth2/code/gateway-client-oidc}
    oauth:
      client-id: ${GATEWAY_CLIENT_ID:gateway}
      client-secret: ${GATEWAY_CLIENT_SECRET:}
      scopes:
        - openid
        - catalog.read
        - catalog.write
      use-pkce-with-authorization-code-grant: true
  oAuthFlow:
    authorizationUrl: ${AUTH_AUTHORIZATION_URL:http://localhost:8082/oauth2/authorize}
    tokenUrl: ${AUTH_TOKEN_URL:http://localhost:8082/oauth2/token}

# Kafka custom
kafka:
  bootstrapAddress: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Routing datasource — writes + Flyway to the primary, read-only tx to the replica
catalog:
  datasource:
    writer:
      url: ${CATALOG_DB_WRITER_URL:jdbc:postgresql://localhost:5432/catalog}
    reader:
      url: ${CATALOG_DB_READER_URL:jdbc:postgresql://localhost:5433/catalog}
  # Swagger points at the gateway, which owns the OAuth2 client.
  openapi:
    server-url: ${CATALOG_OPENAPI_SERVER_URL:https://localhost:8081}
