server:
  port: 8084

spring:
  #Data Source Properties — credentials shared by the routed writer/reader pools
  datasource:
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  #JPA Properties
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  #Security
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8082
          jwk-set-uri: http://localhost:8082/oauth2/jwks

  #Pagination
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

  #Redis
  data:
    redis:
      host: localhost
      port: 6379
      # Bound a stalled Redis: the default Lettuce timeouts let idempotency and
      # after-commit cache calls block for tens of seconds before failing open.
      timeout: 1s
      connect-timeout: 1s

  #Spring Cloud — Spring Cloud 2025.1 only certifies Boot 4.0.x; suppress the verifier on Boot 4.1.x
  cloud:
    compatibility-verifier:
      enabled: false

  #Cache
  cache:
    type: redis

  #Kafka
  kafka:
    bootstrap-servers: localhost:9092

  #Docker Compose Support
  docker:
    compose:
      enabled: true
      file: compose.yaml
      lifecycle-management: start_and_stop
      skip:
        in-tests: true

  #Virtual Threads
  threads:
    virtual:
      enabled: true

#Logging Levels
#Disable the default loggers
logging:
  level:
    blog: WARN
    root: INFO
    org:
      springframework:
        web: INFO
        security: INFO
        oauth2: INFO

#Eureka
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka


#Prometheus (and other data loggers)
management:
  endpoint:
    health:
      show-details: when-authorized
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: 0.1
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces

#Spring Doc
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    disable-swagger-default-url: true
    oauth2RedirectUrl: http://127.0.0.1:8081/login/oauth2/code/gateway-client-oidc
    oauth:
      client-id: gateway
      client-secret: ${GATEWAY_CLIENT_SECRET}
      scopes:
        - openid
        - catalog.read
        - catalog.write
      use-pkce-with-authorization-code-grant: true
  oAuthFlow:
    authorizationUrl: http://localhost:8082/oauth2/authorize
    tokenUrl: http://localhost:8082/oauth2/token

#Kafka custom
kafka:
  bootstrapAddress: localhost:9092

#Routing datasource — writes + Flyway to the primary, read-only tx to the replica
catalog:
  datasource:
    writer:
      url: jdbc:postgresql://localhost:5432/catalog
    reader:
      url: jdbc:postgresql://localhost:5433/catalog
  #How often the transactional-outbox relay sweeps unsettled events
  outbox:
    relay-interval-ms: 1000
