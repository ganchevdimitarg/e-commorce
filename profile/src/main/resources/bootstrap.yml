server:
  port: 8083

spring:
  application:
    name: profile-service

  profiles:
    active: dev

  config:
    import:
      - "optional:vault://"
      - "optional:file:.env[.properties]"

  devtools:
    livereload:
      port: 35730

  cloud:
    vault:
      uri: http://localhost:8200
      authentication: TOKEN
      token: ${VAULT_DEV_ROOT_TOKEN_ID}
      kv:
        enabled: true
        backend: secret
        default-context: profile-service
        profile-separator: "/"
      generic:
        enabled: false
    config:
      import: "optional:vault://"
