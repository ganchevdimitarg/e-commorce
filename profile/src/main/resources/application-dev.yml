spring:
  main:
    web-application-type: reactive

  #Jackson — tolerant inbound event deserialisation
  jackson:
    deserialization:
      fail-on-unknown-properties: false

  #Security
  security:
    oauth2:
      resource-server:
        jwt:
          issuer-uri: http://localhost:8082
          jwk-set-uri: http://localhost:8082/oauth2/jwks
      client:
        registration:
          gateway-client-oidc:
            provider: spring
            client-id: ${GATEWAY_CLIENT_ID}
            client-secret: ${GATEWAY_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            redirect-uri: "http://127.0.0.1:8081/login/oauth2/code/{registrationId}"
        provider:
          spring:
            issuer-uri: http://localhost:8082
            authorization-uri: http://localhost:8082/oauth2/authorize
            token-uri: http://localhost:8082/oauth2/token

  #Data Source Properties (Spring Boot 4.x: spring.mongodb.* — not spring.data.mongodb.*)
  mongodb:
    uri: mongodb://${MONGO_DB_USERNAME}:${MONGO_DB_PASSWORD}@localhost:27017/${MONGO_DB_DATABASE}
#    username:
#    password:
#    database:
#    port: 27017
#    host: localhost

  #Kafka
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}


kafka-settings:
  topics:
    mail: sentMail
#Logging Levels
#Disable the default loggers
logging:
  level:
    blog: WARN
    root: INFO
    org:
      springframework:
        data: INFO
        web: INFO
        security: INFO
        oauth2: INFO

#Eureka
eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USERNAME:eureka}:${EUREKA_PASSWORD}@localhost:8761/eureka,http://${EUREKA_USERNAME:eureka}:${EUREKA_PASSWORD}@localhost:8762/eureka

#Prometheus (and other data loggers)
management:
  tracing:
    sampling:
      probability: 1.0  # 100% for development
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs
  health:
    circuitbreakers:
      enabled: true

#Spring Doc
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    disable-swagger-default-url: true
    oauth2RedirectUrl: http://127.0.0.1:8081/login/oauth2/code/gateway-client-oidc
    oauth:
      client-id: ${GATEWAY_CLIENT_ID}
      client-secret: ${GATEWAY_CLIENT_SECRET}
      scopes:
        - openid
        - profile.read
        - profile.write
      use-pkce-with-authorization-code-grant: true
  oAuthFlow:
    authorizationUrl: http://localhost:8082/oauth2/authorize
    tokenUrl: http://localhost:8082/oauth2/token

#Resilience4j
resilience4j.circuitbreaker:
  configs:
    default:
      failureRateThreshold: 50
      minimumNumberOfCalls: 10
      slidingWindowType: TIME_BASED
      slidingWindowSize: 10
      waitDurationInOpenState: 1000
      permittedNumberOfCallsInHalfOpenState: 5
      registerHealthIndicator: true
      recordExceptions:
        - org.springframework.web.client.HttpServerErrorException
        - java.util.concurrent.TimeoutException
        - java.io.IOException
  instances:
    profileService:
      baseConfig: default

resilience4j.timelimiter:
  configs:
    default:
      timeoutDuration: 5s
      cancelRunningFuture: true
  instances:
    profileService:
      baseConfig: default

#JWT secret key
jwt:
  secret:
    key: ${PASSWORD_RESET_TOKEN_SECRET_KEY}
  expiration-minutes: 10

payment:
  base:
    uri: ${PAYMENT_SERVICE_BASE_URI:http://127.0.0.1:8087/api/v1}
  service:
    customer:
      post: ${payment.base.uri}/payment/customer/create-customer
      get: ${payment.base.uri}/payment/customer/get-customer?username=
      delete: ${payment.base.uri}/payment/customer/delete-customer?username=
    card:
      post: ${payment.base.uri}/payment/card/create-card
      get: ${payment.base.uri}/payment/card/get-customer-cards?username=

webClient:
  oauth2Client:
    defaultClientRegistrationId: "gateway-client-oidc"

github:
  clientId: ${GITHUB_CLIENT_ID}
  secret: ${GITHUB_SECRET}
ecommerce:
  oauth2:
    clientId: ${ECOMMERCE_OAUTH2_CLIENT_ID}
    secret: ${ECOMMERCE_OAUTH2_SECRET}

auth:
  server:
    revoke-uri: http://localhost:8082/oauth2/revoke

