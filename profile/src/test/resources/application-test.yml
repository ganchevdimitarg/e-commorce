gateway:
  trust:
    secret: test-shared-secret

spring:
  main:
    banner-mode: off
    log-startup-info: false
    web-application-type: reactive

  jackson:
    deserialization:
      fail-on-unknown-properties: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: "http://localhost/disabled"
          jwk-set-uri: "http://localhost/oauth2/jwks"
      client:
        provider:
          spring:
            authorization-uri: "http://localhost/oauth2/authorize"
            token-uri: "http://localhost/oauth2/token"

  cloud:
    compatibility-verifier:
      enabled: false           # monorepo runs Boot 4.1.0 ahead of the Spring Cloud train
    config:
      enabled: false
      import-check:
        enabled: false
    bootstrap:
      enabled: false

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  mail:
    username: "test@example.com"

springdoc:
  oAuthFlow:
    authorizationUrl: http://localhost/oauth2/authorize
    tokenUrl: http://localhost/oauth2/token

kafka-settings:
  topics:
    mail: sentMail

kafka:
  bootstrapAddress: localhost:9092

auth:
  server:
    revoke-uri: http://localhost/oauth2/revoke

catalog:
  service:
    products:
      get:
        uri: http://localhost/catalog/products

payment:
  service:
    charge:
      post:
        uri: http://localhost/payment/charge
    customer:
      post: http://localhost/payment/customer/create-customer
      get: http://localhost/payment/customer/get-customer?username=
      delete: http://localhost/payment/customer/delete-customer?username=
    card:
      post: http://localhost/payment/card/add-card?username=
      get: http://localhost/payment/card/get-cards?username=

profile:
  service:
    get:
      uri: http://localhost/profile
    post:
      uri: http://localhost/profile

stripe:
  secret:
    key: sk_test_dummy

webClient:
  oauth2Client:
    defaultClientRegistrationId: test-client
  oath2Client:
    defaultClientRegistrationId: test-client

logging:
  level:
    root: ERROR
    com.ganchevdimitarg.profile: DEBUG

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false